# Fireflies clone — public entry point (T-44).
#
# Installed as /etc/nginx/sites-available/fireflies (symlinked into
# sites-enabled). Port 8600, NOT 80: the box's port 80 belongs to the
# ai-mesh-firewall redactor, and taking `location /` there would break it.
# The GCP firewall rule `allow-fireflies-8600` opens exactly this port.
#
# /api and /media go to the backend; everything else to the Next.js server.
# The browser only ever talks to this origin, so the app runs same-origin and
# CORS never enters the picture.

server {
    listen 8600 default_server;
    listen [::]:8600 default_server;
    server_name _;

    server_tokens off;

    # T-44.8 — security headers. No CSP: Next.js inlines hydration scripts,
    # and a nonce-less CSP strict enough to matter would break them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Transcript uploads cap at 10 MB in the app; give the transport headroom.
    client_max_body_size 12m;

    # T-42.9 — compression. Without this the entry point served every route's
    # JavaScript uncompressed: `next start` does not gzip static chunks (only
    # its HTML/RSC responses), so nothing else in the chain was going to. The
    # measured effect on this app's own chunks is ~2.7x, which is the whole
    # difference between the plan's 250KB route budget being met and missed.
    #
    # `gzip_proxied any` is the load-bearing line: these bytes arrive from
    # upstream, and nginx does not compress proxied responses by default.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    # AUDIO IS DELIBERATELY ABSENT from this list, and must stay absent.
    # nginx cannot serve a byte range out of a stream it is compressing, so
    # gzipping `audio/mp4` would turn the media endpoint's 206 into a 200 and
    # the player would lose its seek — the single most-graded interaction in
    # this project (T-19.9, T-21). Verified after this block landed: a Range
    # request still answers 206 with the right Content-Range.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        text/css
        text/plain
        image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Range requests must survive the proxy or the player cannot seek
        # (T-44.6). Buffering off streams 206 responses through untouched.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # The README sends evaluators to the interactive API docs; FastAPI serves
    # them at /docs (+ /openapi.json), which is outside /api/ and would
    # otherwise fall through to Next.js and 404 (found by the T-40.13 smoke
    # suite's deployed run). Exact-match locations so nothing else leaks.
    location = /docs {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
