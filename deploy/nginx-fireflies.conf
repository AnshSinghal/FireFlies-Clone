# Fireflies clone — public entry point (T-44).
#
# Installed as /etc/nginx/sites-available/fireflies (symlinked into
# sites-enabled). Port 8600, NOT 80: the box's port 80 belongs to the
# ai-mesh-firewall redactor, and taking `location /` there would break it.
# The GCP firewall rule `allow-fireflies-8600` opens exactly this port.
#
# /api and /media go to the backend; everything else to the Next.js server.
# The browser only ever talks to this origin, so the app runs same-origin and
# CORS never enters the picture.

server {
    listen 8600 default_server;
    listen [::]:8600 default_server;
    server_name _;

    server_tokens off;

    # T-44.8 — security headers. No CSP: Next.js inlines hydration scripts,
    # and a nonce-less CSP strict enough to matter would break them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Transcript uploads cap at 10 MB in the app; give the transport headroom.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Range requests must survive the proxy or the player cannot seek
        # (T-44.6). Buffering off streams 206 responses through untouched.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # The README sends evaluators to the interactive API docs; FastAPI serves
    # them at /docs (+ /openapi.json), which is outside /api/ and would
    # otherwise fall through to Next.js and 404 (found by the T-40.13 smoke
    # suite's deployed run). Exact-match locations so nothing else leaks.
    location = /docs {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
