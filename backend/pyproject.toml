[project]
name = "fireflies-backend"
version = "0.1.0"
description = "Fireflies clone — FastAPI service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "webvtt-py>=0.5",
    "httpx2>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — lint + format. Replaces flake8, isort and black.
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — catches the unused imports T-46.4 sweeps for
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "B008",  # function call in argument default — this is how FastAPI Depends() works
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow fixtures and use assert freely. TC00x (move imports into a
# TYPE_CHECKING block) is disabled here on purpose: it exists to keep runtime
# import cost and cycles down in application code, and neither concern applies
# to a test module. Enforcing it there buys nothing and adds a guard block to
# every file that annotates a fixture.
"tests/**" = ["ARG001", "ARG002", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict. The plan asks for --strict; encoding it here means the flag
# cannot be forgotten at a call site.
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = ["webvtt.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
